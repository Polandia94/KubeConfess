# ═══════════════════════════════════════════════════════════════════════════════
# vulnerable-workloads.yaml
# A deliberately misconfigured namespace for testing KubeConfess
# Covers: privileged pods, root containers, hostpath mounts, over-privileged SAs,
#         cluster-admin bindings, secrets in env vars, secret volumes
# ═══════════════════════════════════════════════════════════════════════════════

# ── Namespace ─────────────────────────────────────────────────────────────────
