# ── Safe pod — relatively hardened, minimal permissions ───────────────────────
# Demonstrates what a well-configured pod looks like alongside the vulnerable ones.
# Still in vulnerable-workloads namespace so it shows up in namespace scans.
# KubeConfess should give this a mostly clean bill of health.

# ServiceAccount — no bindings, automount disabled
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-safe-app
  namespace: default
automountServiceAccountToken: false   # no k8s API access needed

---
# Secret — credentials injected properly via volume, not env vars
apiVersion: v1
kind: Secret
metadata:
  name: safe-app-config
  namespace: default
type: Opaque
stringData:
  api_key: "safe_app_key_example"
  config.json: |
    {
      "log_level": "info",
      "timeout": 30
    }

---
# Pod — hardened security context, non-root, no host access, read-only filesystem
apiVersion: v1
kind: Pod
metadata:
  name: pod-safe-app
  namespace: default
  labels:
    app: pod-safe-app
    tier: frontend
spec:
  serviceAccountName: sa-safe-app

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  automountServiceAccountToken: false   # belt and braces

  containers:
    - name: app
      image: alpine:latest
      command: ["/bin/sh", "-c", "sleep 86400"]

      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]

      # no sensitive env vars — config via mounted volume only
      env:
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"

      # secret mounted as volume — not injected as env vars
      volumeMounts:
        - name: app-config
          mountPath: /etc/app-config
          readOnly: true
        - name: tmp
          mountPath: /tmp   # writable scratch space since root fs is read-only

      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

  volumes:
    - name: app-config
      secret:
        secretName: safe-app-config
        defaultMode: 0400   # read-only, owner only
    - name: tmp
      emptyDir: {}   # ephemeral, not host-backed

  restartPolicy: Always